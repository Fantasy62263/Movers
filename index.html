    <div class="subtitle">💡 <i>Em hãy đọc kỹ câu hỏi, bấm nút <b>"💡 Gợi ý"</b> nếu cần gợi ý tư duy, sau đó chọn đáp án đúng nhất nhé!</i></div>

<script>
const quizData = {
    1: {
        title: "Bài 1: Phân Biệt Từ Nhận Biết (Signal Words)",
        questions: [
            { q: "She ___ breakfast every morning.", hint: "💡 <b>Từ nhận biết:</b> 'every morning' chỉ thói quen hàng ngày → Dùng <b>Hiện Tại Đơn</b>. 'She' (chủ ngữ số ít) → Động từ phải thêm <b>-s</b> hoặc <b>-es</b>.", opts: ["A. eats", "B. is eating", "C. eat", "D. eating"], ans: "A", exp: "Hiện tại đơn với 'She': eats." },
            { q: "Look! The dog ___ in the river.", hint: "💡 <b>Từ nhận biết:</b> 'Look!' chỉ hành động đang diễn ra → Dùng <b>Hiện Tại Tiếp Diễn</b> (am/is/are + V-ing). 'The dog' (số ít) → Chọn trợ động từ <b>is</b>.", opts: ["A. swims", "B. swim", "C. is swimming", "D. are swimming"], ans: "C", exp: "Hiện tại tiếp diễn: is swimming." },
            { q: "They usually ___ football on Sundays.", hint: "💡 <b>Từ nhận biết:</b> 'usually' chỉ thói quen → Dùng <b>Hiện Tại Đơn</b>. 'They' (số nhiều) → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. play", "B. is playing", "C. are playing", "D. plays"], ans: "A", exp: "Hiện tại đơn với 'They': play." },
            { q: "Listen! The baby ___ in the room.", hint: "💡 <b>Từ nhận biết:</b> 'Listen!' gây sự chú ý vào hành động đang xảy ra → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'The baby' (số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. cries", "B. is crying", "C. cry", "D. are crying"], ans: "B", exp: "Hiện tại tiếp diễn: is crying." },
            { q: "My father ___ his car right now.", hint: "💡 <b>Từ nhận biết:</b> 'right now' (ngay bây giờ) → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'My father' (số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. washes", "B. wash", "C. is washing", "D. are washing"], ans: "C", exp: "Hiện tại tiếp diễn: is washing." },
            { q: "We ___ to school by bus every day.", hint: "💡 <b>Từ nhận biết:</b> 'every day' chỉ lịch trình hàng ngày → Dùng <b>Hiện Tại Đơn</b>. 'We' → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. go", "B. goes", "C. are going", "D. is going"], ans: "A", exp: "Hiện tại đơn với 'We': go." },
            { q: "At the moment, I ___ a funny cartoon.", hint: "💡 <b>Từ nhận biết:</b> 'At the moment' → Dùng <b>Hiện Tại Tiếp Diễn</b>. Chủ ngữ 'I' luôn đi cùng trợ động từ <b>am</b>.", opts: ["A. watch", "B. watches", "C. am watching", "D. is watching"], ans: "C", exp: "Hiện tại tiếp diễn với 'I': am watching." },
            { q: "Cats always ___ milk.", hint: "💡 <b>Từ nhận biết:</b> 'always' chỉ sở thích/thói quen → Dùng <b>Hiện Tại Đơn</b>. 'Cats' (số nhiều) → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. like", "B. is liking", "C. likes", "D. are liking"], ans: "A", exp: "Hiện tại đơn: like." },
            { q: "Quiet, please! The students ___ a test.", hint: "💡 <b>Từ nhận biết:</b> 'Quiet, please!' nhắc nhở hành động đang diễn ra → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'The students' (số nhiều) → Dùng <b>are + V-ing</b>.", opts: ["A. do", "B. does", "C. is doing", "D. are doing"], ans: "D", exp: "Hiện tại tiếp diễn: are doing." },
            { q: "He often ___ television after dinner.", hint: "💡 <b>Từ nhận biết:</b> 'often' chỉ tần suất → Dùng <b>Hiện Tại Đơn</b>. 'He' (số ít), động từ kết thúc bằng đuôi -ch → Thêm <b>-es</b>.", opts: ["A. watch", "B. watches", "C. is watching", "D. are watching"], ans: "B", exp: "Hiện tại đơn với 'He': watches." },
            { q: "Now, my mother ___ dinner in the kitchen.", hint: "💡 <b>Từ nhận biết:</b> 'Now' → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'My mother' (số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. cooks", "B. cook", "C. is cooking", "D. are cooking"], ans: "C", exp: "Hiện tại tiếp diễn: is cooking." },
            { q: "Tom and Mary ___ ice cream every weekend.", hint: "💡 <b>Từ nhận biết:</b> 'every weekend' → Dùng <b>Hiện Tại Đơn</b>. 'Tom and Mary' (2 người = số nhiều) → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. eats", "B. eat", "C. is eating", "D. are eating"], ans: "B", exp: "Hiện tại đơn số nhiều: eat." },
            { q: "Look! A red car ___ very fast.", hint: "💡 <b>Từ nhận biết:</b> 'Look!' → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'A red car' (1 chiếc xe = số ít) → Dùng <b>is + V-ing</b> (Lưu ý: động từ kết thúc bằng 'e' thì bỏ 'e' trước khi thêm -ing).", opts: ["A. comes", "B. come", "C. is coming", "D. are coming"], ans: "C", exp: "Hiện tại tiếp diễn: is coming." },
            { q: "I never ___ lie to my parents.", hint: "💡 <b>Từ nhận biết:</b> 'never' chỉ thói quen → Dùng <b>Hiện Tại Đơn</b>. Chủ ngữ 'I' → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. tell", "B. tells", "C. am telling", "D. is telling"], ans: "A", exp: "Hiện tại đơn với 'I': tell." },
            { q: "Be quiet! The baby ___.", hint: "💡 <b>Từ nhận biết:</b> 'Be quiet!' → Hành động đang xảy ra → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'The baby' (số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. sleeps", "B. sleep", "C. is sleeping", "D. are sleeping"], ans: "C", exp: "Hiện tại tiếp diễn: is sleeping." },
            { q: "On Mondays, we ___ English lessons.", hint: "💡 <b>Từ nhận biết:</b> 'On Mondays' chỉ lịch trình cố định → Dùng <b>Hiện Tại Đơn</b>. 'We' → Dùng dạng nguyên mẫu của động từ 'have/has'.", opts: ["A. have", "B. has", "C. are having", "D. is having"], ans: "A", exp: "Hiện tại đơn với 'We': have." },
            { q: "At present, the sun ___ brightly.", hint: "💡 <b>Từ nhận biết:</b> 'At present' → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'The sun' (số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. shines", "B. shine", "C. is shining", "D. are shining"], ans: "C", exp: "Hiện tại tiếp diễn: is shining." },
            { q: "My brother sometimes ___ his bike to the park.", hint: "💡 <b>Từ nhận biết:</b> 'sometimes' → Dùng <b>Hiện Tại Đơn</b>. 'My brother' (số ít) → Động từ thêm <b>-s</b>.", opts: ["A. rides", "B. ride", "C. is riding", "D. are riding"], ans: "A", exp: "Hiện tại đơn với 'My brother': rides." },
            { q: "Listen! Somebody ___ at the front door.", hint: "💡 <b>Từ nhận biết:</b> 'Listen!' → Dùng <b>Hiện Tại Tiếp Diễn</b>. 'Somebody' (Ai đó = đại từ số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. knocks", "B. knock", "C. is knocking", "D. are knocking"], ans: "C", exp: "Hiện tại tiếp diễn: is knocking." },
            { q: "Birds ___ in the sky.", hint: "💡 Đây là một sự thật tự nhiên → Dùng <b>Hiện Tại Đơn</b>. 'Birds' (số nhiều) → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. fly", "B. flies", "C. is flying", "D. are flying"], ans: "A", exp: "Hiện tại đơn chỉ sự thật: fly." }
        ]
    },
    2: {
        title: "Bài 2: Câu Khẳng Định (Affirmative Forms)",
        questions: [
            { q: "She (read) ___ a book in her room right now.", hint: "💡 Dấu hiệu: 'right now' → Thì <b>Hiện Tại Tiếp Diễn</b>. Công thức cho 'She': <b>is + V-ing</b>.", opts: ["A. reads", "B. is reading", "C. read", "D. are reading"], ans: "B", exp: "She is reading." },
            { q: "He usually (get up) ___ at 6 o'clock.", hint: "💡 Dấu hiệu: 'usually' → Thì <b>Hiện Tại Đơn</b>. Công thức cho 'He' (số ít): <b>V + s/es</b>.", opts: ["A. gets up", "B. get up", "C. is getting up", "D. are getting up"], ans: "A", exp: "He gets up." },
            { q: "Look! The birds (sing) ___ on the tree.", hint: "💡 Dấu hiệu: 'Look!' → Thì <b>Hiện Tại Tiếp Diễn</b>. 'The birds' (số nhiều) → Dùng <b>are + V-ing</b>.", opts: ["A. sing", "B. sings", "C. is singing", "D. are singing"], ans: "D", exp: "The birds are singing." },
            { q: "My mother (cook) ___ delicious food every day.", hint: "💡 Dấu hiệu: 'every day' → Thì <b>Hiện Tại Đơn</b>. 'My mother' (số ít) → Thêm <b>-s</b> vào sau động từ.", opts: ["A. cooks", "B. cook", "C. is cooking", "D. are cooking"], ans: "A", exp: "My mother cooks." },
            { q: "I (do) ___ my homework at the moment.", hint: "💡 Dấu hiệu: 'at the moment' → Thì <b>Hiện Tại Tiếp Diễn</b>. 'I' → Dùng <b>am + V-ing</b>.", opts: ["A. do", "B. does", "C. am doing", "D. is doing"], ans: "C", exp: "I am doing." },
            { q: "They (play) ___ basketball every afternoon.", hint: "💡 Dấu hiệu: 'every afternoon' → Thì <b>Hiện Tại Đơn</b>. 'They' (số nhiều) → Giữ <b>nguyên mẫu</b> động từ.", opts: ["A. plays", "B. play", "C. are playing", "D. is playing"], ans: "B", exp: "They play." },
            { q: "Listen! Anna (play) ___ the piano.", hint: "💡 Dấu hiệu: 'Listen!' → Thì <b>Hiện Tại Tiếp Diễn</b>. 'Anna' (số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. plays", "B. play", "C. is playing", "D. are playing"], ans: "C", exp: "Anna is playing." },
            { q: "The Earth (go) ___ around the Sun.", hint: "💡 Diễn tả chân lý hiển nhiên → Thì <b>Hiện Tại Đơn</b>. 'The Earth' (số ít), động từ kết thúc bằng đuôi -o → Thêm <b>-es</b>.", opts: ["A. goes", "B. go", "C. is going", "D. are going"], ans: "A", exp: "The Earth goes." },
            { q: "Right now, we (learn) ___ English.", hint: "💡 Dấu hiệu: 'Right now' → Thì <b>Hiện Tại Tiếp Diễn</b>. 'We' (số nhiều) → Dùng <b>are + V-ing</b>.", opts: ["A. learn", "B. learns", "C. is learning", "D. are learning"], ans: "D", exp: "We are learning." },
            { q: "Tom (wash) ___ his hands before meals.", hint: "💡 Dấu hiệu: Thói quen ăn uống → Thì <b>Hiện Tại Đơn</b>. 'Tom' (số ít), động từ kết thúc bằng -sh → Thêm <b>-es</b>.", opts: ["A. washes", "B. wash", "C. is washing", "D. are washing"], ans: "A", exp: "Tom washes." },
            { q: "Look! The bus (come) ___!", hint: "💡 Dấu hiệu: 'Look!' → Thì <b>Hiện Tại Tiếp Diễn</b>. 'The bus' (số ít) → Dùng <b>is + V-ing</b> (Lưu ý: bỏ 'e' ở cuối từ 'come' trước khi thêm -ing).", opts: ["A. comes", "B. come", "C. is coming", "D. are coming"], ans: "C", exp: "The bus is coming." },
            { q: "My parents (work) ___ in a hospital.", hint: "💡 Diễn tả công việc cố định → Thì <b>Hiện Tại Đơn</b>. 'My parents' (số nhiều) → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. works", "B. work", "C. are working", "D. is working"], ans: "B", exp: "My parents work." },
            { q: "At present, my dad (repair) ___ his bike.", hint: "💡 Dấu hiệu: 'At present' → Thì <b>Hiện Tại Tiếp Diễn</b>. 'My dad' (số ít) → Dùng <b>is + V-ing</b>.", opts: ["A. repairs", "B. repair", "C. is repairing", "D. are repairing"], ans: "C", exp: "My dad is repairing." },
            { q: "Monkeys (love) ___ bananas.", hint: "💡 Sự thật về loài vật → Thì <b>Hiện Tại Đơn</b>. 'Monkeys' (số nhiều) → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. loves", "B. love", "C. is loving", "D. are loving"], ans: "B", exp: "Monkeys love." },

            { q: "I always (clean) ___ my room on Saturday.", hint: "💡 Dấu hiệu: 'always' → Thì <b>Hiện Tại Đơn</b>. Chủ ngữ 'I' → Động từ ở dạng <b>nguyên mẫu</b>.", opts: ["A. cleans", "B. clean", "C. am cleaning", "D. is cleaning"], ans: "B", exp: "I clean." },
            { q: "Look! The children (run) ___ on the grass.", hint: "💡 Dấu hiệu: 'Look!' → Thì <b>Hiện Tại Tiếp Diễn</b>. 'The children' (số nhiều) → Dùng <b>are + V-ing</b> (Quy tắc chính tả: gấp đôi chữ 'n' trong 'run').", opts: ["A. runs", "B. run", "C. is running", "D. are running"], ans: "D", exp: "The children are running." },

            { q: "My brother (play) ___ video games twice a week.", hint: "💡 'twice a week' (tần suất) → <b>Hiện Tại Đơn</b>. Chủ ngữ 'My brother' (số ít) → Động từ thêm <b>-s</b>.", opts: ["A. plays", "B. play", "C. is playing", "D. are playing"], ans: "A", exp: "Tần suất -> plays." },
            { q: "Look! The butterflies (fly) ___ over the colorful flowers.", hint: "💡 'Look!' → <b>Hiện Tại Tiếp Diễn</b>. Chủ ngữ 'The butterflies' (số nhiều) → Dùng công thức: <b>are + V-ing</b>.", opts: ["A. flies", "B. fly", "C. is flying", "D. are flying"], ans: "D", exp: "Look! -> are flying." },
            { q: "She (know) ___ how to speak English very well.", hint: "💡 Động từ chỉ nhận thức 'know' KHÔNG dùng dạng -ing → Chia <b>Hiện Tại Đơn</b>. Chủ ngữ 'She' → Động từ thêm <b>-s</b>.", opts: ["A. is knowing", "B. knows", "C. know", "D. are knowing"], ans: "B", exp: "'know' không chia Tiếp diễn -> knows." },
            { q: "Don't make noise! My baby brother (sleep) ___.", hint: "💡 'Don't make noise!' → <b>Hiện Tại Tiếp Diễn</b>. 'My baby brother' (số ít) → Dùng công thức: <b>is + V-ing</b>.", opts: ["A. sleeps", "B. sleep", "C. is sleeping", "D. are sleeping"], ans: "C", exp: "is sleeping." },
            { q: "___ they (go) ___ to the park on Sundays?", hint: "💡 'on Sundays' → Câu hỏi <b>Hiện Tại Đơn</b>. Chủ ngữ 'they' → Công thức: <b>Do + S + V-nguyên-thể?</b>", opts: ["A. Are / going", "B. Do / go", "C. Does / go", "D. Is / going"], ans: "B", exp: "Do they go...?" },
            { q: "Right now, my mother (bake) ___ a birthday cake for me.", hint: "💡 'Right now' → <b>Hiện Tại Tiếp Diễn</b>. Chủ ngữ 'my mother' (số ít) → Dùng công thức: <b>is + V-ing</b> (Bỏ 'e' cuối từ 'bake' rồi thêm -ing).", opts: ["A. bakes", "B. bake", "C. is baking", "D. are baking"], ans: "C", exp: "Right now -> is baking." }
        ]
    }
};

function toggleSingleHint(qId) {
    const qDiv = document.getElementById(qId);
    const btn = qDiv.querySelector('.btn-hint-single');
    
    qDiv.classList.toggle('show-hint');
    
    if (qDiv.classList.contains('show-hint')) {
        btn.innerHTML = '🙈 Ẩn gợi ý';
        btn.classList.add('active');
    } else {
        btn.innerHTML = '💡 Gợi ý';
        btn.classList.remove('active');
    }
}

function renderAllQuiz() {
    const container = document.getElementById('quiz-container');
    let html = '';

    for (let exNum = 1; exNum <= 5; exNum++) {
        const exData = quizData[exNum];
        html += `
            <div class="exercise-card">
                <h2 class="exercise-title">${exData.title}</h2>
                <form id="form-ex${exNum}">
        `;

        exData.questions.forEach((item, index) => {
            const qNum = index + 1;
            const qId = `ex${exNum}-q${qNum}`;
            
            html += `
                <div class="question" id="${qId}">
                    <div class="question-header">
                        <div class="question-text">Câu ${qNum}: ${item.q}</div>
                        <button type="button" class="btn-hint-single" onclick="toggleSingleHint('${qId}')">💡 Gợi ý</button>
                    </div>
                    <div class="hint-box">${item.hint}</div>
                    <div class="options">
            `;

            item.opts.forEach(opt => {
                const optVal = opt.charAt(0);
                html += `
                    <label>
                        <input type="radio" name="${qId}" value="${optVal}">
                        ${opt}
                    </label>
                `;
            });

            html += `
                    </div>
                    <div class="explanation" id="exp-${qId}"></div>
                </div>
            `;
        });

        html += `
                </form>
                <button type="button" class="btn-check" onclick="checkExercise(${exNum})">Check Bài ${exNum}</button>
                <div id="result-ex${exNum}" class="result-box"></div>
            </div>
        `;
    }

    container.innerHTML = html;
}

function checkExercise(exNum) {
    let score = 0;
    const total = 20;
    const questions = quizData[exNum].questions;

    questions.forEach((item, index) => {
        const qNum = index + 1;
        const qId = `ex${exNum}-q${qNum}`;
        const qDiv = document.getElementById(qId);
        const expDiv = document.getElementById(`exp-${qId}`);
        const selected = document.querySelector(`input[name="${qId}"]:checked`);

        if (selected) {
            if (selected.value === item.ans) {
                score++;
                qDiv.className = "question correct" + (qDiv.classList.contains('show-hint') ? " show-hint" : "");
                expDiv.innerHTML = `✅ Đúng rồi! <i>(${item.exp})</i>`;
                expDiv.style.color = "#047857";
            } else {
                qDiv.className = "question incorrect" + (qDiv.classList.contains('show-hint') ? " show-hint" : "");
                expDiv.innerHTML = `❌ Chưa chính xác. Đáp án đúng là <b>${item.ans}</b>. <i>(${item.exp})</i>`;
                expDiv.style.color = "#b91c1c";
            }
        } else {
            qDiv.className = "question incorrect" + (qDiv.classList.contains('show-hint') ? " show-hint" : "");
            expDiv.innerHTML = `⚠️ Em chưa chọn đáp án! Đáp án đúng là <b>${item.ans}</b>. <i>(${item.exp})</i>`;
            expDiv.style.color = "#d97706";
        }
    });

    const resultBox = document.getElementById(`result-ex${exNum}`);
    resultBox.style.display = "block";
    let comment = "";
    if (score === 20) comment = "🎉 Xuất sắc! Em đã làm đúng tất cả các câu!";
    else if (score >= 15) comment = "🌟 Rất tốt! Em đã nắm vững kiến thức bài này.";
    else if (score >= 10) comment = "👍 Khá tốt! Em hãy bấm nút '💡 Gợi ý' ở các câu sai để kiểm tra lại nhé.";
    else comment = "💪 Cố gắng lên nhé! Đọc kỹ gợi ý ở mỗi câu sẽ giúp em chọn đúng đáp án dễ hơn.";

    resultBox.innerHTML = `
        <h3 style="margin-top:0; color: #0f766e;">📊 Kết Quả Bài ${exNum}: ${score}/${total} Câu Đúng</h3>
        <p style="margin-bottom:0;"><b>Nhận xét:</b> ${comment}</p>
    `;

    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

window.onload = renderAllQuiz;
</script>
