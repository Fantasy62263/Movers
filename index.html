function toggleSingleHint(qId) {
    const qDiv = document.getElementById(qId);
    const btn = qDiv.querySelector('.btn-hint-single');
    qDiv.classList.toggle('show-hint');
    if (qDiv.classList.contains('show-hint')) {
        btn.innerHTML = '🙈 Ẩn gợi ý';
        btn.classList.add('active');
    } else {
        btn.innerHTML = '💡 Gợi ý';
        btn.classList.remove('active');
    }
}

function renderAllQuiz() {
    const container = document.getElementById('quiz-container');
    let html = '';

    for (let exNum = 1; exNum <= 5; exNum++) {
        const exData = quizData[exNum];
        html += `
            <div class="exercise-card" id="card-ex${exNum}">
                <h2 class="exercise-title">${exData.title}</h2>
                <form id="form-ex${exNum}">
        `;

        exData.questions.forEach((item, index) => {
            const qNum = index + 1;
            const qId = `ex${exNum}-q${qNum}`;
            
            html += `
                <div class="question" id="${qId}">
                    <div class="question-header">
                        <div class="question-text">Câu ${qNum}: ${item.q}</div>
                        <button type="button" class="btn-hint-single" onclick="toggleSingleHint('${qId}')">💡 Gợi ý</button>
                    </div>
                    <div class="hint-box">${item.hint}</div>
                    <div class="options">
            `;

            item.opts.forEach(opt => {
                const optVal = opt.charAt(0);
                html += `
                    <label>
                        <input type="radio" name="${qId}" value="${optVal}">
                        ${opt}
                    </label>
                `;
            });

            html += `
                    </div>
                    <div class="explanation" id="exp-${qId}"></div>
                </div>
            `;
        });

        html += `
                </form>
                <button type="button" class="btn-check" onclick="checkExercise(${exNum})">Check Bài ${exNum}</button>
                <div id="result-ex${exNum}" class="result-box"></div>
            </div>
        `;
    }

    container.innerHTML = html;
}

function checkExercise(exNum) {
    const studentNameInput = document.getElementById('student-name');
    const studentName = studentNameInput.value.trim();

    if (!studentName) {
        alert("⚠️ Học sinh vui lòng nhập TÊN ở đầu trang trước khi bấm Check bài nhé!");
        studentNameInput.focus();
        return;
    }

    let score = 0;
    const total = 20;
    const questions = quizData[exNum].questions;
    let detailsHTMLArr = [];

    questions.forEach((item, index) => {
        const qNum = index + 1;
        const qId = `ex${exNum}-q${qNum}`;
        const qDiv = document.getElementById(qId);
        const expDiv = document.getElementById(`exp-${qId}`);
        const selected = document.querySelector(`input[name="${qId}"]:checked`);

        let statusText = "";
        let color = "#ef4444";

        if (selected) {
            if (selected.value === item.ans) {
                score++;
                qDiv.className = "question correct" + (qDiv.classList.contains('show-hint') ? " show-hint" : "");
                expDiv.innerHTML = `✅ Đúng rồi! <i>(${item.exp})</i>`;
                expDiv.style.color = "#047857";
                statusText = `<b>Đúng</b> (Chọn ${selected.value})`;
                color = "#047857";
            } else {
                qDiv.className = "question incorrect" + (qDiv.classList.contains('show-hint') ? " show-hint" : "");
                expDiv.innerHTML = `❌ Chưa chính xác. Đáp án đúng là <b>${item.ans}</b>. <i>(${item.exp})</i>`;
                expDiv.style.color = "#b91c1c";
                statusText = `<b>Sai</b> (Chọn ${selected.value} - Đáp án đúng: ${item.ans})`;
            }
        } else {
            qDiv.className = "question incorrect" + (qDiv.classList.contains('show-hint') ? " show-hint" : "");
            expDiv.innerHTML = `⚠️ Em chưa chọn đáp án! Đáp án đúng là <b>${item.ans}</b>. <i>(${item.exp})</i>`;
            expDiv.style.color = "#d97706";
            statusText = `<b>Chưa chọn</b> (Đáp án đúng: ${item.ans})`;
        }

        detailsHTMLArr.push(`<p style="margin: 4px 0; color: ${color};"><b>Câu ${qNum}:</b> ${item.q}<br>&rarr; Trạng thái: ${statusText}</p>`);
    });

    const resultBox = document.getElementById(`result-ex${exNum}`);
    resultBox.style.display = "block";
    let comment = "";
    if (score === 20) comment = "🎉 Xuất sắc! Em đã làm đúng tất cả các câu!";
    else if (score >= 15) comment = "🌟 Rất tốt! Em đã nắm vững kiến thức thì Tương lai gần.";
    else if (score >= 10) comment = "👍 Khá tốt! Em hãy bấm '💡 Gợi ý' ở các câu sai để xem lại nhé.";
    else comment = "💪 Cố gắng lên nhé! Đọc kỹ gợi ý ở từng câu để làm tốt hơn.";

    resultBox.innerHTML = `
        <h3 style="margin-top:0; color: #0f766e;">📊 Kết Quả Bài ${exNum}: ${score}/${total} Câu Đúng</h3>
        <p><b>Tên học sinh:</b> ${studentName}</p>
        <p><b>Nhận xét:</b> ${comment}</p>
        <div id="email-status-ex${exNum}" class="status-sending">⏳ Đang gửi kết quả bài làm...</div>
    `;

    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Tự động gửi kết quả ngầm qua Web App Google Script về Email giáo viên
    fetch(TEACHER_CONFIG.googleScriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            studentName: studentName,
            exerciseTitle: quizData[exNum].title,
            score: `${score}/${total}`,
            detailsHTML: detailsHTMLArr.join("")
        })
    })
    .then(() => {
        const st = document.getElementById(`email-status-ex${exNum}`);
        if (st) {
            st.className = "status-success";
            st.innerHTML = "📧 ĐÃ GỬI BÀI THÀNH CÔNG!";
        }
    })
    .catch(err => {
        const st = document.getElementById(`email-status-ex${exNum}`);
        if (st) {
            st.className = "status-sending";
            st.style.color = "#dc2626";
            st.innerHTML = "❌ Lỗi kết nối mạng, vui lòng kiểm tra đường truyền.";
        }
    });
}
